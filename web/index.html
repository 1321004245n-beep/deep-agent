<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deep Agent · AI 对话</title>
  <link rel="stylesheet" href="/static/style.css?v=20260805" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✦</text></svg>" />
</head>
<body>
  <div class="app">

    <!-- 左侧: 历史会话栏 -->
    <aside id="sidebar" class="sidebar" aria-label="历史会话">
      <div class="sidebar-head">
        <button id="new-session-btn" class="new-session-btn" title="新建会话">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
               stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
          新会话
        </button>
      </div>
      <div id="session-list" class="session-list" role="list"></div>
      <div class="sidebar-foot">
        <div class="sidebar-brand">✦ Deep Agent</div>
      </div>
    </aside>

    <!-- 移动端遮罩 -->
    <div id="sidebar-mask" class="sidebar-mask"></div>

    <!-- 右侧: 聊天区 -->
    <div class="chat-col">

      <!-- 顶部栏 -->
      <header class="header">
        <div class="brand">
          <button id="sidebar-toggle" class="icon-btn sidebar-toggle" title="会话列表" aria-label="会话列表">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
          </button>
          <div class="logo">✦</div>
          <div>
            <h1>Deep Agent</h1>
            <div class="status">
              <span class="dot"></span>
              <span>在线</span>
            </div>
          </div>
        </div>
        <div class="actions">
          <button id="theme-btn" class="icon-btn" title="切换主题" aria-label="切换主题">
            <svg id="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round"></svg>
          </button>
          <button id="clear-btn" class="icon-btn" title="删除当前会话" aria-label="删除当前会话">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6h14z"/>
              <path d="M10 11v6M14 11v6"/>
            </svg>
          </button>
        </div>
      </header>

      <!-- 消息区 -->
      <main id="messages" class="messages"></main>

      <!-- 输入区 -->
      <footer class="composer">
        <div id="attach-list" class="attach-list"></div>
        <div class="input-wrap">
          <textarea id="input" rows="1"
            placeholder="给 Deep Agent 发消息…（Enter 发送，Shift+Enter 换行）"></textarea>
          <div class="input-toolbar">
            <div class="toolbar-left">
              <button id="attach-btn" class="attach-btn" title="添加附件" aria-label="添加附件">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                  <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
                </svg>
              </button>
              <input type="file" id="file-input" multiple hidden />
              <select id="model-select" class="model-select" title="切换模型" aria-label="切换模型">
                <option value="deepseek-v4-flash">deepseek-v4-flash</option>
                <option value="deepseek-chat">deepseek-chat</option>
                <option value="deepseek-reasoner">deepseek-reasoner</option>
                <option value="glm-5.2">glm-5.2</option>
              </select>
            </div>
            <div class="toolbar-right">
              <button id="send-btn" class="send-btn" disabled title="发送" aria-label="发送">
                <svg id="send-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                  <path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7z"/>
                </svg>
              </button>
            </div>
          </div>
        </div>
        <p class="hint">由 deepagents 驱动 · <kbd>Enter</kbd> 发送 · <kbd>Shift</kbd>+<kbd>Enter</kbd> 换行</p>
      </footer>

    </div>
  </div>

  <script src="/static/app.js?v=20260805d"></script>
</body>
</html>
