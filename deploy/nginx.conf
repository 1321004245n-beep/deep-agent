# Deep Agent Web Chat - nginx 反向代理示例（SSE 长连接必需配置）
# 安装: sudo cp nginx.conf /etc/nginx/conf.d/deep-agent.conf
# 证书路径按实际修改; 无域名/证书时可先用 80 端口
# 重载: sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    # listen 443 ssl http2;           # 有证书时启用
    server_name your-domain.com;      # 改成你的域名或 IP

    # ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    # ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    # 上传附件体积上限（与后端 5MB 一致, 留余量）
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # SSE 关键: 必须保留 Upgrade/Connection 头
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 流式输出防断连
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;          # 关闭缓冲, 让 token 实时到达浏览器
    }
}
